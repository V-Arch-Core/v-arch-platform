<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>V-Arch | AI-Driven Hardware Architecture</title>
    <style>
        body { background: #0a0a0a; color: #00ff41; font-family: 'Courier New', Courier, monospace; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; overflow: hidden; }
        .container { border: 1px solid #00ff41; padding: 40px; max-width: 700px; box-shadow: 0 0 20px rgba(0,255,65,0.2); background: rgba(0, 20, 0, 0.9); }
        h1 { font-size: 2.2em; border-bottom: 2px solid #00ff41; padding-bottom: 15px; margin-top: 0; }
        p { line-height: 1.8; font-size: 1.1em; }
        .status-bar { background: #00ff41; color: #000; padding: 5px 10px; font-weight: bold; margin-bottom: 20px; display: inline-block; }
        .action-link { color: #00ff41; border: 1px solid #00ff41; padding: 10px 20px; text-decoration: none; display: inline-block; margin-top: 25px; transition: all 0.3s; }
        .action-link:hover { background: #00ff41; color: #000; }
        .glitch { animation: flash 2s infinite; }
        @keyframes flash { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="status-bar">SYSTEM: ONLINE</div>
        <h1>V-Arch Protocol v1.0</h1>
        <p>> <span class="glitch">正在驗證硬體誠信...</span></p>
        <p>> 當前專案：UBike 戶外電子紙看板 (架構評估中)</p>
        <p>> 核心邏輯：太陽能收支平衡模擬 / 零金流公益驗證</p>
        <p>> 警告：排除一切人為利益干擾</p>
        <a href="https://github.com/V-Arch-Core/v-arch-platform" class="action-link">進入核心儲存庫</a>
    </div>
</body>
</html>
